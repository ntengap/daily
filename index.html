<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily · Quotidien</title><meta name="theme-color" content="#F1F4F3">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:#F1F4F3;color:#17202A;font-family:system-ui,-apple-system,'Segoe UI','Noto Sans',sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;flex:1}
.sw{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:0 1px 4px #0001;align-self:center}
.sw button{border:0;background:none;font:600 15px inherit;font-family:inherit;padding:10px 18px;border-radius:999px;color:#5b6770;cursor:pointer}
.sw button.on{background:#17202A;color:#fff}
h1{font-size:28px;line-height:1.15;text-align:center;margin:32px 0 6px}
p.s{text-align:center;color:#5b6770;margin:0 0 24px;font-size:16px}
.cards{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
a.c{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#fff;border-radius:24px;padding:26px 26px;min-height:112px;box-shadow:0 4px 14px #0002;transition:transform .12s}
a.c:active{transform:scale(.97)}
a.c b{font-size:44px;line-height:1;font-weight:800}
a.c span{font-size:17px;font-weight:600;opacity:.92}
a.c i{font-style:normal;font-size:30px;opacity:.9}
.zh{background:#C8372D}.ur{background:#0F6B5B}.es{background:#E08A1E}.fr{background:#2E7D4F}.en{background:#1F4E9C}
.ft{text-align:center;color:#8a949b;font-size:13px;margin-top:22px}
</style></head><body><div class="wrap">
<div class="sw"><button data-l="en">I speak English</button><button data-l="fr">Je parle français</button><button data-l="ur">میں اردو بولتا ہوں</button></div>
<h1 id="h"></h1><p class="s" id="s"></p>
<div class="cards" id="cards"></div>
<div class="ft" id="f"></div></div>
<script>
const T={
en:{h:"What do you want to learn?",s:"4 words a day. Learn, spell, speak.",f:"Daily · Quotidien",
 c:[["zh","中文","Mandarin","en-zh"],["es","Español","Spanish","en-es"],["fr","Français","French","en-fr"],["ur","اردو","Urdu","en-ur"]]},
fr:{h:"Tu veux apprendre quoi&nbsp;?",s:"4 mots par jour. Apprendre, épeler, parler.",f:"Daily · Quotidien",
 c:[["zh","中文","Mandarin","fr-zh"],["es","Español","Espagnol","fr-es"],["en","English","Anglais","fr-en"]]},
ur:{h:"آپ کیا سیکھنا چاہتے ہیں؟",s:"روزانہ 4 الفاظ۔ سیکھو، ہجے کرو، بولو۔",f:"Daily · Quotidien",
 c:[["en","English","انگریزی","ur-en"]]}};
function show(l){
 try{localStorage.setItem('lang',l)}catch(e){}
 document.documentElement.lang=l;document.body.dir=l==='ur'?'rtl':'ltr';const t=T[l];
 h.innerHTML=t.h;s.textContent=t.s;f.textContent=t.f;
 cards.innerHTML=t.c.map(c=>`<a class="c ${c[0]}" href="${c[3]}/"><div><b>${c[1]}</b><br><span>${c[2]}</span></div><i>›</i></a>`).join('');
 document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>show(b.dataset.l));
let l;try{l=localStorage.getItem('lang')}catch(e){}
show(l||((navigator.language||'').startsWith('fr')?'fr':(navigator.language||'').startsWith('ur')?'ur':'en'));
</script></body></html>
